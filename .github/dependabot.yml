# Weekly, one grouped PR per ecosystem. Dependabot PRs get no OIDC token, so they run
# checks but skip the plan.
version: 2
updates:
  # package.json forces minimatch to ^11.0.1 (resolutions) for GHSA-g3hv-75wg-m249, which
  # eslint and typescript-eslint cannot reach while they require ^10; drop it once they require 11.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Tracks the Node major CI and Lambda run (24.x in the workflows, nodejs24.x in
      # api/lambda.tf); bump all three together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 supports TypeScript <6.1; unpin once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infrastructure/terraform/bootstrap
      - /infrastructure/terraform/api
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
